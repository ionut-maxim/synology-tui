# Tag vX.Y.Z → GoReleaser builds macOS/Linux binaries and a GitHub release,
# which `mise use -g github:ionut-maxim/synology-tui` installs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_LOCKED: "1" # install only what mise.lock records, checksums included
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.14 # reads mise.lock's format (older mise can't)
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
